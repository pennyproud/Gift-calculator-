<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Christmas Gift Calculator 🎄</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f6efe5;min-height:100vh;display:flex;justify-content:center;align-items:center;padding:18px;color:#fff}
.box{width:min(650px,100%);background:linear-gradient(145deg,#173f2b,#0f2d20);border-radius:28px;padding:24px;box-shadow:0 14px 40px #0003}
.snow{text-align:center;font-size:24px;letter-spacing:7px}.title{text-align:center;font-size:clamp(28px,7vw,42px);margin:8px 0;font-weight:800}.sub{text-align:center;color:#e9dfd0;margin:0 0 22px}
.progress{height:7px;background:#ffffff29;border-radius:99px;overflow:hidden;margin-bottom:24px}.bar{height:100%;background:#d8a63a;width:0%;transition:.3s}
.qnum{text-align:center;color:#f2c75c;font-weight:700;font-size:13px;margin-bottom:8px}h2{text-align:center;font-size:22px;line-height:1.25;margin:0 auto 18px;max-width:520px}
.choices{display:grid;gap:10px}.choice{width:100%;min-height:50px;border-radius:15px;border:1px solid #ffffff33;background:#ffffff17;color:#fff;font-size:15px;font-weight:650;padding:12px 15px;text-align:left;cursor:pointer}.choice:hover{background:#ffffff2b}
.lock{background:#ffffff14;border-radius:18px;padding:15px;margin-bottom:13px;text-align:center;color:#eee5d8;font-size:14px}.result-title{text-align:center;font-size:28px;font-weight:800}.result-sub{text-align:center;color:#e8dfd3;margin-bottom:20px}
.gift{display:flex;align-items:center;gap:12px;padding:13px;margin:9px 0;border-radius:17px;background:#ffffff17;border:1px solid #ffffff22}.emoji{font-size:28px;width:40px;text-align:center}.gift b{display:block}.gift small{color:#dcd1c4}.rank{margin-left:auto;background:#d8a63a;color:#173f2b;border-radius:99px;padding:5px 9px;font-weight:800;font-size:12px}
.again{display:block;margin:20px auto 0;border:0;border-radius:999px;background:#fff;color:#173f2b;font-weight:800;padding:13px 22px;cursor:pointer;font-size:15px}.note{font-size:12px;color:#cfc5b8;text-align:center;margin-top:15px;line-height:1.4}
</style>
</head>
<body>
<main class="box">
<div class="snow">✦ ❄︎ ✦ ❄︎ ✦</div>
<div class="title">Christmas Gift Calculator 🎄</div>
<p class="sub">Let's figure out what gifts you'd be MOST excited to get this Christmas.</p>
<div class="progress"><div class="bar" id="bar"></div></div>
<div id="screen"></div>
</main>
<script>
const gifts={
funko:{name:'Funko Pops',emoji:'🧸',score:0},cards:{name:'Gift cards',emoji:'💳',score:0},
money:{name:'Money',emoji:'💵',score:0},coraline:{name:'Coraline stuff',emoji:'🧵',score:0},
vanilla:{name:'Vanilla scented things',emoji:'🕯️',score:0},jewelry:{name:'Gold jewelry',emoji:'✨',score:0},
clothes:{name:'Cute clothes',emoji:'👗',score:0}};
const qs=[
['On a scale of 1–5, how excited are you for Christmas this year?',[['1','I need Christmas to hurry up 😭'],['2',"I'm kinda excited"],['3','Pretty excited'],['4','VERY excited'],['5','I AM CHRISTMAS 🎄😭']]],
['If you could only pick ONE gift category right now, what would you choose?',[['funko','Funko Pops 🧸'],['cards','Gift cards 💳'],['money','Money 💵'],['coraline','Coraline stuff 🧵'],['vanilla','Vanilla scented things 🕯️'],['jewelry','Gold jewelry ✨'],['clothes','Cute clothes 👗']]],
['Which kind of gift feels the most fun to open?',[['collect','Something to collect/display'],['choice','Something where I get to choose what I want'],['cash','Something I can save or spend'],['room','Something cute for my room'],['scent','Something that makes me smell good / makes my space smell good'],['wear','Something I can wear']]],
['Which vibe sounds MOST like you?',[['cute','Cute & girly 💗'],['alt','A little edgy / cool 🖤'],['cozy','Cozy & comfy ☁️'],['classic','Simple & pretty ✨'],['mix','A mix of everything 🎀']]],
['Okay… what about clothes? 👀',[['yes','YES — show me cute clothes! 💗'],['maybe','Maybe, but ask me before suggesting anything specific'],['no','No clothes this time — skip them']]]
];
let step=0,clothingChoice='';
function reset(){Object.values(gifts).forEach(g=>g.score=0)}
function add(k,n=2){if(gifts[k])gifts[k].score+=n}
function render(){
 if(step>=qs.length)return result();
 bar.style.width=(step/qs.length*100)+'%';
 const [title,choices]=qs[step];
 screen.innerHTML=`<div class="qnum">QUESTION ${step+1} OF ${qs.length}</div><h2>${title}</h2><div class="choices">${choices.map(([v,t])=>`<button class="choice" data-v="${v}">${t}</button>`).join('')}</div>`;
 document.querySelectorAll('.choice').forEach(b=>b.onclick=()=>answer(b.dataset.v));
}
function answer(v){
 if(step===0){let n=+v;if(n>=4){add('funko');add('coraline');add('vanilla');add('jewelry')}else{add('cards');add('money')}}
 if(step===1)add(v,6);
 if(step===2){
  if(v==='collect')add('funko',4); if(v==='choice')add('cards',4); if(v==='cash')add('money',4);
  if(v==='room')add('coraline',4); if(v==='scent')add('vanilla',4);
  if(v==='wear'){add('jewelry',2);add('clothes',3)}
 }
 if(step===3){
  if(v==='cute'){add('clothes',3);add('jewelry',2)} if(v==='alt'){add('funko',2);add('coraline',3)}
  if(v==='cozy')add('vanilla',3); if(v==='classic')add('jewelry',3)
  if(v==='mix'){add('clothes',2);add('funko');add('jewelry')}
 }
 if(step===4){clothingChoice=v;if(v==='yes')add('clothes',5);if(v==='maybe')add('clothes',2);if(v==='no')gifts.clothes.score=-999}
 step++;render();
}
function result(){
 bar.style.width='100%';
 let arr=Object.values(gifts).filter(g=>g.score>-100).sort((a,b)=>b.score-a.score).slice(0,5);
 let note=clothingChoice==='maybe'?'<div class="lock">👗 <b>Clothing note:</b> I’ll ask you before recommending a specific clothing item if the style isn’t obviously something you’d like.</div>':clothingChoice==='no'?'<div class="lock">👗 Clothes were skipped, just like you asked!</div>':'';
 screen.innerHTML=`<div class="result-title">🎁 Your Gift Results 🎁</div><p class="result-sub">Based on your answers, Santa has some ideas…</p>${note}${arr.map((g,i)=>`<div class="gift"><div class="emoji">${g.emoji}</div><div><b>${g.name}</b><small>${i===0?'Top match for your answers 💚':g.name==='Cute clothes'?'Great match — but we can check your style first 👀':'Another gift that fits your wishlist ✨'}</small></div><span class="rank">#${i+1}</span></div>`).join('')}<button class="again" id="again">↻ Take it again</button><div class="note">This is just a fun preference calculator — you can still put EVERYTHING on your wishlist. 🎄</div>`;
 document.getElementById('again').onclick=()=>{reset();step=0;clothingChoice='';render()}
}
reset();render();
</script>
</body>
</html>
